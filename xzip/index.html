<script>
/* =============================
   小破站解压 - 单文件纯静态版
   ============================= */

/* =============================
   RingProgress - 环形进度提示
   ============================= */
const RingProgress = {
  el: null,
  C: 2 * Math.PI * 52, // 周长 ≈ 326.7
  init() { this.el = document.getElementById('ring-overlay'); },
  /* show(text, indeterminate=true)；indeterminate=false 时后续用 set(percent) */
  show(text, indeterminate = true) {
    if (!this.el) this.init();
    document.getElementById('ring-text').textContent = text || '';
    this.el.classList.add('active');
    this.el.classList.toggle('indeterminate', !!indeterminate);
    if (indeterminate) {
      document.getElementById('ring-percent').textContent = '';
    } else {
      this.set(0);
    }
  },
  setText(t) {
    if (!this.el) this.init();
    document.getElementById('ring-text').textContent = t || '';
  },
  set(percent) {
    const p = Math.max(0, Math.min(100, percent));
    const v = document.getElementById('ring-value');
    v.style.strokeDasharray = this.C;
    v.style.strokeDashoffset = this.C * (1 - p / 100);
    document.getElementById('ring-percent').textContent = Math.round(p) + '%';
  },
  hide() {
    if (!this.el) this.init();
    this.el.classList.remove('active', 'indeterminate');
    const v = document.getElementById('ring-value');
    v.style.strokeDashoffset = this.C;
    document.getElementById('ring-percent').textContent = '';
    document.getElementById('ring-text').textContent = '';
  }
};

/* =============================
   ExitGuard - 返回键防误触守卫
   文件列表页：第一次返回提示，2.5 秒内再按一次才真正退出
   ============================= */
const ExitGuard = {
  armed: false,
  firstAt: 0,
  suppress: false,

  arm() {
    if (this.armed) return;
    history.pushState({ __guard: true }, '');
    this.armed = true;
    this.firstAt = 0;
  },

  /* 程序化移除守卫（回家/切换文件），静默不触发提示 */
  disarm() {
    if (!this.armed) return;
    this.suppress = true;
    this.armed = false;
    this.firstAt = 0;
    history.back();
  },

  /* popstate：守卫条目刚被弹出 */
  onPopState() {
    if (this.suppress) { this.suppress = false; return; }
    if (!this.armed) return;
    this.armed = false;
    const now = Date.now();
    if (this.firstAt && now - this.firstAt < 2500) {
      // 第二次返回：真正退出网页
      this.firstAt = 0;
      history.back();
      return;
    }
    // 第一次返回：提示并重新压入守卫
    this.firstAt = now;
    app.showToast('再按一次退出网页', 2200);
    history.pushState({ __guard: true }, '');
    this.armed = true;
    setTimeout(() => {
      // 超时后第一次失效，需要重新双击
      if (Date.now() - this.firstAt >= 2400) this.firstAt = 0;
    }, 2550);
  }
};

window.addEventListener('popstate', () => {
  // 预览开着：返回 = 关闭预览（守卫仍在栈底）
  if (Preview.isOpen()) { Preview.handleBack(); return; }
  if (ExitGuard.armed) { ExitGuard.onPopState(); }
});

const app = {
  mode: null,
  // Extract state
  zipReader: null,
  zipEntries: [],
  treeData: null,
  extractFile: null,
  pendingPasswordEntry: null,
  pendingPasswordResolve: null,
  // Compress state
  compressFiles: [],
  selectedCompressIds: new Set(),

  /* ---- Navigation ---- */
  setMode(mode) {
    this.mode = mode;
    document.getElementById('mode-modal').classList.remove('active');
    document.getElementById('extract-view').style.display = mode === 'extract' ? 'flex' : 'none';
    document.getElementById('compress-view').style.display = mode === 'compress' ? 'flex' : 'none';
  },

  goHome() {
    this.mode = null;
    // 预览开着先关掉（包含其历史条目）
    if (Preview.isOpen()) Preview.close();
    // 静默移除返回守卫
    ExitGuard.disarm();
    document.getElementById('mode-modal').classList.add('active');
    document.getElementById('extract-view').style.display = 'none';
    document.getElementById('compress-view').style.display = 'none';
    this.resetExtract();
    this.resetCompress();
  },

  /* ---- Hash / Info ---- */
  async computeHashes(blob) {
    const buf = await this.blobToArrayBuffer(blob);
    const [md5, sha1, sha256, sha512] = await Promise.all([
      Promise.resolve(this.md5(buf)),
      this.sha1(buf),
      this.sha256(buf),
      this.sha512(buf)
    ]);
    return { md5, sha1, sha256, sha512 };
  },

  async sha1(buf) {
    const hash = await crypto.subtle.digest('SHA-1', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  },

  async sha256(buf) {
    const hash = await crypto.subtle.digest('SHA-256', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  },

  async sha512(buf) {
    const hash = await crypto.subtle.digest('SHA-512', buf);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, '0')).join('');
  },

  md5(input) {
    // 紧凑 MD5 实现
    function md5cycle(x, k) {
      var a = x[0], b = x[1], c = x[2], d = x[3];
      a = ff(a, b, c, d, k[0], 7, -680876936); d = ff(d, a, b, c, k[1], 12, -389564586); c = ff(c, d, a, b, k[2], 17, 606105819); b = ff(b, c, d, a, k[3], 22, -1044525330);
      a = ff(a, b, c, d, k[4], 7, -176418897); d = ff(d, a, b, c, k[5], 12, 1200080426); c = ff(c, d, a, b, k[6], 17, -1473231341); b = ff(b, c, d, a, k[7], 22, -45705983);
      a = ff(a, b, c, d, k[8], 7, 1770035416); d = ff(d, a, b, c, k[9], 12, -1958414417); c = ff(c, d, a, b, k[10], 17, -42063); b = ff(b, c, d, a, k[11], 22, -1990404162);
      a = ff(a, b, c, d, k[12], 7, 1804603682); d = ff(d, a, b, c, k[13], 12, -40341101); c = ff(c, d, a, b, k[14], 17, -1502002290); b = ff(b, c, d, a, k[15], 22, 1236535329);
      a = gg(a, b, c, d, k[1], 5, -165796510); d = gg(d, a, b, c, k[6], 9, -1069501632); c = gg(c, d, a, b, k[11], 14, 643717713); b = gg(b, c, d, a, k[0], 20, -373897302);
      a = gg(a, b, c, d, k[5], 5, -701558691); d = gg(d, a, b, c, k[10], 9, 38016083); c = gg(c, d, a, b, k[15], 14, -660478335); b = gg(b, c, d, a, k[4], 20, -405537848);
      a = gg(a, b, c, d, k[9], 5, 568446438); d = gg(d, a, b, c, k[14], 9, -1019803690); c = gg(c, d, a, b, k[3], 14, -187363961); b = gg(b, c, d, a, k[8], 20, 1163531501);
      a = gg(a, b, c, d, k[13], 5, -1444681467); d = gg(d, a, b, c, k[2], 9, -51403784); c = gg(c, d, a, b, k[7], 14, 1735328473); b = gg(b, c, d, a, k[12], 20, -1926607734);
      a = hh(a, b, c, d, k[5], 4, -378558); d = hh(d, a, b, c, k[8], 11, -2022574463); c = hh(c, d, a, b, k[11], 16, 1839030562); b = hh(b, c, d, a, k[14], 23, -35309556);
      a = hh(a, b, c, d, k[1], 4, -1530992060); d = hh(d, a, b, c, k[4], 11, 1272893353); c = hh(c, d, a, b, k[7], 16, -155497632); b = hh(b, c, d, a, k[10], 23, -1094730640);
      a = hh(a, b, c, d, k[13], 4, 681279174); d = hh(d, a, b, c, k[0], 11, -358537222); c = hh(c, d, a, b, k[3], 16, -722521979); b = hh(b, c, d, a, k[6], 23, 76029189);
      a = hh(a, b, c, d, k[9], 4, -640364487); d = hh(d, a, b, c, k[12], 11, -421815835); c = hh(c, d, a, b, k[15], 16, 530742520); b = hh(b, c, d, a, k[2], 23, -995338651);
      a = ii(a, b, c, d, k[0], 6, -198630844); d = ii(d, a, b, c, k[7], 10, 1126891415); c = ii(c, d, a, b, k[14], 15, -1416354905); b = ii(b, c, d, a, k[5], 21, -57434055);
      a = ii(a, b, c, d, k[12], 6, 1700485571); d = ii(d, a, b, c, k[3], 10, -1894986606); c = ii(c, d, a, b, k[10], 15, -1051523); b = ii(b, c, d, a, k[1], 21, -2054922799);
      a = ii(a, b, c, d, k[8], 6, 1873313359); d = ii(d, a, b, c, k[15], 10, -30611744); c = ii(c, d, a, b, k[6], 15, -1560198380); b = ii(b, c, d, a, k[13], 21, 1309151649);
      a = ii(a, b, c, d, k[4], 6, -145523070); d = ii(d, a, b, c, k[11], 10, -1120210379); c = ii(c, d, a, b, k[2], 15, 718787259); b = ii(b, c, d, a, k[9], 21, -343485551);
      x[0] = add32(a, x[0]); x[1] = add32(b, x[1]); x[2] = add32(c, x[2]); x[3] = add32(d, x[3]);
    }
    function cmn(q, a, b, x, s, t) { a = add32(add32(a, q), add32(x, t)); return add32((a << s) | (a >>> (32 - s)), b); }
    function ff(a, b, c, d, x, s, t) { return cmn((b & c) | (~b & d), a, b, x, s, t); }
    function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & ~d), a, b, x, s, t); }
    function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
    function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | ~d), a, b, x, s, t); }
    function add32(a, b) { return (a + b) & 0xFFFFFFFF; }
    function md51(s) {
      var txt = '', n = s.length, state = [1732584193, -271733879, -1732584194, 271733878], i;
      for (i = 64; i <= n; i += 64) md5cycle(state, md5blk(s.substring(i - 64, i)));
      s = s.substring(i - 64);
      var tail = new Array(16).fill(0);
      for (i = 0; i < s.length; i++) tail[i >> 2] |= s.charCodeAt(i) << (i % 4 << 3);
      tail[i >> 2] |= 0x80 << (i % 4 << 3);
      if (i > 55) { md5cycle(state, tail); tail = new Array(16).fill(0); }
      tail[14] = n * 8;
      md5cycle(state, tail);
      return state;
    }
    function md5blk(s) {
      var md5blks = [], i;
      for (i = 0; i < 64; i += 4) md5blks[i >> 2] = s.charCodeAt(i) + (s.charCodeAt(i + 1) << 8) + (s.charCodeAt(i + 2) << 16) + (s.charCodeAt(i + 3) << 24);
      return md5blks;
    }
    function rhex(n) {
      const hex_chr = '0123456789abcdef';
      var s = '', j;
      for (j = 0; j < 4; j++) s += hex_chr.charAt((n >> (j * 8 + 4)) & 0x0F) + hex_chr.charAt((n >> (j * 8)) & 0x0F);
      return s;
    }
    function hex(x) { return x.map(rhex).join(''); }
    // 将 ArrayBuffer 转为字符串（Latin-1）
    var s = '';
    var bytes = new Uint8Array(input);
    var chunks = [];
    for (var i = 0; i < bytes.length; i += 8192) {
      chunks.push(String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)));
    }
    s = chunks.join('');
    return hex(md51(s));
  },

  showFileInfo(elId, name, size, hashes) {
    const el = document.getElementById(elId);
    if (!el) return;
    const fmtSize = (n) => n < 1024 ? n + ' B' : n < 1048576 ? (n/1024).toFixed(1) + ' KB' : (n/1048576).toFixed(2) + ' MB';
    el.innerHTML = `
      <div class="info-row"><span class="info-label">文件</span><span class="info-value">${name}</span></div>
      <div class="info-row"><span class="info-label">大小</span><span class="info-value">${fmtSize(size)}</span></div>
      <div class="info-row"><span class="info-label">MD5</span><span class="info-value">${hashes.md5}</span></div>
      <div class="info-row"><span class="info-label">SHA-1</span><span class="info-value">${hashes.sha1}</span></div>
      <div class="info-row"><span class="info-label">SHA-256</span><span class="info-value">${hashes.sha256}</span></div>
      <div class="info-row"><span class="info-label">SHA-512</span><span class="info-value">${hashes.sha512}</span></div>
    `;
    el.style.display = 'block';
  },

  hideFileInfo(elId) {
    const el = document.getElementById(elId);
    if (el) el.style.display = 'none';
  },

  /* ---- Toast ---- */
  showToast(msg, duration = 2200) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(this._toastTimer);
    this._toastTimer = setTimeout(() => t.classList.remove('show'), duration);
  },

  /* ---- Extract: file select ---- */
  detectFormat(file) {
    const n = file.name.toLowerCase();
    if (n.endsWith('.zip') || n.endsWith('.apk') || n.endsWith('.jar') || n.endsWith('.zipx')) return 'zip';
    if (n.endsWith('.tar')) return 'tar';
    if (n.endsWith('.tgz') || n.endsWith('.tar.gz')) return 'tgz';
    return 'sevenzip'; // rar/7z/exe/iso 等
  },

  async onExtractFileSelect(file) {
    if (!file) return;
    this.extractFile = file;
    this.archiveFormat = this.detectFormat(file);
    RingProgress.show('正在读取压缩包，文件较大请稍候...', true);
    let lastErr;
    // 手机端：刚下载完的文件提供器可能暂未就绪，最多重试 3 次
    for (let attempt = 0; attempt < 3; attempt++) {
      try {
        if (this.archiveFormat === 'zip') {
          await this.loadZip(file);
        } else if (this.archiveFormat === 'tar') {
          await this.loadTar(file);
        } else if (this.archiveFormat === 'tgz' || this.archiveFormat === 'gz') {
          await this.loadGz(file);
        } else {
          await this.loadSevenzip(file);
        }
        lastErr = null;
        break;
      } catch (e) {
        lastErr = e;
        console.warn('读取尝试 ' + (attempt + 1) + ' 失败:', e);
        if (attempt < 2) {
          RingProgress.setText('文件尚未就绪，正在重试 (' + (attempt + 1) + '/2)...');
          await new Promise(r => setTimeout(r, 900));
        }
      }
    }
    if (lastErr) {
      RingProgress.hide();
      this.showToast('读取失败: ' + (lastErr.message || lastErr));
      console.error(lastErr);
      return;
    }
    this.buildTree();
    this.renderTree();
    document.getElementById('extract-drop').style.display = 'none';
    document.getElementById('extract-tree').style.display = 'block';
    document.getElementById('extract-bar').style.display = 'flex';
    RingProgress.hide();
    this.showToast(`共 ${this.zipEntries.filter(e=>!e.directory).length} 个文件`);
    // 压入返回守卫：文件列表页按一次返回不会退出网页
    ExitGuard.arm();
    // 异步计算哈希
    this.computeHashes(file).then(hashes => {
      this.showFileInfo('extract-info', file.name, file.size, hashes);
    }).catch(err => console.error('哈希计算失败:', err));
  },

  /* ---- ZIP via zip.js (流式，最省内存) ---- */
  async loadZip(file) {
    this.zipReader = new zip.ZipReader(new zip.BlobReader(file));
    const entries = await this.zipReader.getEntries();
    this.zipEntries = entries.map(e => ({
      filename: e.filename,
      directory: e.directory,
      uncompressedSize: e.uncompressedSize,
      encrypted: e.encrypted,
      _zipEntry: e,
      _source: 'zip'
    }));
  },

  /* ---- TAR 流式解析 ---- */
  async loadTar(file) {
    const entries = [];
    const buf = await file.arrayBuffer();
    const view = new DataView(buf);
    let offset = 0;
    let pendingLongName = null;
    while (offset + 512 <= buf.byteLength) {
      const name = this.readTarString(view, offset, 100);
      if (!name) break;
      const size = parseInt(this.readTarString(view, offset + 124, 12).trim(), 8) || 0;
      const type = view.getUint8(offset + 156);
      const dataOffset = offset + 512;
      if (type === 76) {
        // GNU longname 'L'：读取长文件名，跳过后面的数据块
        const longNameBytes = new Uint8Array(buf, dataOffset, size);
        pendingLongName = new TextDecoder().decode(longNameBytes).replace(/\0+$/, '');
        offset = dataOffset + Math.ceil(size / 512) * 512;
        continue;
      }
      const finalName = pendingLongName || name;
      pendingLongName = null;
      // 过滤 GNU tar 扩展头
      if (finalName.includes('@PaxHeader') || finalName.includes('@LongLink')) {
        offset = dataOffset + Math.ceil(size / 512) * 512;
        continue;
      }
      entries.push({
        filename: finalName,
        directory: type === 53,
        uncompressedSize: type === 53 ? 0 : size,
        encrypted: false,
        _tarOffset: dataOffset,
        _tarSize: size,
        _tarFile: file,
        _source: 'tar'
      });
      offset = dataOffset + Math.ceil(size / 512) * 512;
    }
    this.zipEntries = entries;
  },

  readTarString(view, offset, len) {
    let s = '';
    for (let i = 0; i < len; i++) {
      const b = view.getUint8(offset + i);
      if (b === 0) break;
      s += String.fromCharCode(b);
    }
    return s;
  },

  /* ---- GZ/TGZ via fflate ---- */
  async loadGz(file) {
    const isTgz = this.archiveFormat === 'tgz';
    // fflate gunzipSync 会一次性解压到内存，限制 500MB
    if (file.size > 500 * 1024 * 1024) {
      throw new Error('GZ 文件超过 500MB，为避免内存溢出请使用 ZIP/TAR 格式');
    }
    const compressed = new Uint8Array(await file.arrayBuffer());
    const decompressed = fflate.gunzipSync(compressed);
    if (isTgz) {
      // 解压后是 TAR，再解析
      const tarBlob = new Blob([decompressed]);
      const tarFile = new File([tarBlob], file.name.replace(/\.tgz$|\.tar\.gz$/i, '.tar'));
      await this.loadTar(tarFile);
    } else {
      // 单文件 GZ
      const outName = file.name.replace(/\.gz$/i, '');
      this.zipEntries = [{
        filename: outName,
        directory: false,
        uncompressedSize: decompressed.length,
        encrypted: false,
        _gzData: decompressed,
        _source: 'gz'
      }];
    }
  },

  /* ---- 7z / RAR / 其他格式 via sevenzip-wasm ---- */
  async loadSevenzip(file) {
    if (file.size > 1024 * 1024 * 1024) {
      throw new Error('该格式超过 1GB，为避免内存溢出请使用 ZIP 格式');
    }
    if (typeof SevenZipWasm === 'undefined') {
      await this.loadScript('sevenzip-wasm.js?v=202610075');
    }
    if (!this.szInstance) {
      this.szInstance = await SevenZipWasm({
        print: () => {},
        printErr: () => {}
      });
    }
    const FS = this.szInstance.FS;
    // 清理旧数据
    try { FS.unlink('/input.archive'); } catch {}
    try { this.szRmdirRecursive('/extracted'); } catch {}
    // 写入压缩文件（使用 blobToArrayBuffer 修复 Chrome Blob bug）
    const data = new Uint8Array(await this.blobToArrayBuffer(file));
    FS.writeFile('/input.archive', data);
    // 创建输出目录
    FS.mkdirTree('/extracted');
    // 解压全部（callMain 是同步的，先让环形进度条渲染出来）
    RingProgress.setText('正在解压，文件越大耗时越久，请稍候...');
    await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    try {
      this.szInstance.callMain(['x', '/input.archive', '-o/extracted/', '-y']);
    } catch (e) {
      try {
        FS.readdir('/extracted');
      } catch {
        throw new Error('解压失败，格式不支持或文件损坏');
      }
    }
    // 遍历目录树
    const entries = [];
    const walk = (path, relPath) => {
      const items = FS.readdir(path);
      for (const item of items) {
        if (item === '.' || item === '..') continue;
        const fullPath = path + '/' + item;
        const stat = FS.stat(fullPath);
        const isDir = FS.isDir(stat.mode);
        const entryRelPath = relPath ? relPath + '/' + item : item;
        entries.push({
          filename: entryRelPath,
          directory: isDir,
          uncompressedSize: isDir ? 0 : stat.size,
          encrypted: false,
          _szPath: fullPath,
          _source: 'sevenzip'
        });
        if (isDir) walk(fullPath, entryRelPath);
      }
    };
    walk('/extracted', '');
    this.zipEntries = entries;
  },

  szRmdirRecursive(path) {
    const FS = this.szInstance.FS;
    const items = FS.readdir(path);
    for (const item of items) {
      if (item === '.' || item === '..') continue;
      const fullPath = path + '/' + item;
      const stat = FS.stat(fullPath);
      if (FS.isDir(stat.mode)) {
        this.szRmdirRecursive(fullPath);
      } else {
        FS.unlink(fullPath);
      }
    }
    FS.rmdir(path);
  },

  buildTree() {
    const root = { name: '', isDirectory: true, children: {}, entries: [] };
    for (const entry of this.zipEntries) {
      const parts = entry.filename.split('/').filter(Boolean);
      if (parts.length === 0) continue;
      let node = root;
      for (let i = 0; i < parts.length; i++) {
        const part = parts[i];
        const isLast = i === parts.length - 1;
        if (isLast && !entry.directory) {
          node.children[part] = {
            name: part,
            isDirectory: false,
            size: entry.uncompressedSize,
            entry: entry,
            expanded: false
          };
        } else {
          if (!node.children[part]) {
            node.children[part] = { name: part, isDirectory: true, children: {}, expanded: false };
          }
          node = node.children[part];
        }
      }
    }
    this.treeData = root;
  },

  renderTree() {
    const container = document.getElementById('extract-tree');
    const html = this.renderTreeNode(this.treeData, '', 0);
    container.innerHTML = html || '<div class="tree-empty">压缩包是空的</div>';
  },

  renderTreeNode(node, path, depth) {
    if (!node.children) return '';
    const keys = Object.keys(node.children).sort((a, b) => {
      const ca = node.children[a].isDirectory ? 0 : 1;
      const cb = node.children[b].isDirectory ? 0 : 1;
      if (ca !== cb) return ca - cb;
      return a.localeCompare(b);
    });
    let html = '';
    for (const key of keys) {
      const child = node.children[key];
      const fullPath = path ? path + '/' + key : key;
      const indentClass = depth > 0 ? 'tree-indent' : '';
      if (child.isDirectory) {
        html += `
          <div class="tree-item ${indentClass}" onclick="app.toggleTree('${this.escapeAttr(fullPath)}',event)">
            <span class="tree-toggle">${child.expanded ? '📂' : '📁'}</span>
            <span class="tree-icon">${child.expanded ? '📂' : '📁'}</span>
            <span class="tree-name">${this.escapeHtml(key)}</span>
          </div>
          <div class="tree-children ${child.expanded ? 'expanded' : ''}" id="tree-${this.escapeAttr(fullPath)}">
            ${this.renderTreeNode(child, fullPath, depth + 1)}
          </div>`;
      } else {
        const sizeStr = this.formatSize(child.size);
        const icon = this.getFileIcon(key);
        html += `
          <div class="tree-item ${indentClass}" draggable="true"
               onmousedown="app.prepareDrag('${this.escapeAttr(fullPath)}')"
               ondragstart="app.onTreeDragStart(event,'${this.escapeAttr(fullPath)}')"
               onclick="app.onTreeFileClick('${this.escapeAttr(fullPath)}')">
            <span class="tree-toggle" style="visibility:hidden"></span>
            <span class="tree-icon">${icon}</span>
            <span class="tree-name">${this.escapeHtml(key)}</span>
            <span class="tree-size">${sizeStr}</span>
            <button class="tree-download" title="下载" onclick="event.stopPropagation();app.downloadOneFile('${this.escapeAttr(fullPath)}')">⬇</button>
          </div>`;
      }
    }
    return html;
  },

  toggleTree(path, event) {
    event.stopPropagation();
    let node = this.treeData;
    const parts = path.split('/').filter(Boolean);
    for (const part of parts) {
      if (node.children && node.children[part]) node = node.children[part];
    }
    if (node && node.isDirectory) {
      node.expanded = !node.expanded;
      this.renderTree();
    }
  },

  /* ---- Preview ---- */
  nestedArchiveExts: ['zip','rar','7z','tar','gz','tgz','bz2','xz','apk','jar','exe','iso'],

  async onTreeFileClick(fullPath) {
    const entry = this.zipEntries.find(e => e.filename === fullPath);
    if (!entry) return;
    const ext = fullPath.split('.').pop().toLowerCase();

    // 嵌套压缩包：新窗口打开
    if (this.nestedArchiveExts.includes(ext)) {
      return this.openNestedArchive(entry, fullPath);
    }

    const previewable = ['jpg','jpeg','png','gif','webp','svg','bmp','ico','avif','heic',
      'mp4','webm','mov','mkv','avi','flv','wmv','m4v','ts',
      'mp3','wav','ogg','flac','m4a','aac','opus','wma',
      'pdf','txt','md','log',
      'doc','docx','xls','xlsx','csv',
      'pptx','pptm','ppsx','ppt',
      'c','h','s','java','py','html','htm','css','js','ts','jsx','tsx','json','xml','yml','yaml','toml','ini','conf','rs','go','php','cpp','cc','cxx','sh','bat','cmd','sql','rb','swift','kt','dart','vue'].includes(ext);
    if (!previewable) {
      // 不支持预览的文件：点击直接下载
      return this.downloadOneFile(fullPath);
    }
    try {
      RingProgress.show('正在读取文件...');
      const blob = await this.getEntryBlob(entry);
      // Preview.open 内部负责在渲染完成后隐藏环形进度条
      await Preview.open(blob, fullPath, () => {
        // 关闭回调（如需）
      });
    } catch(e) {
      RingProgress.hide();
      console.error(e);
      this.showToast('预览失败，可点文件右侧 ⬇ 下载');
    }
  },

  /* ---- 嵌套压缩包：新窗口 + postMessage 传递 Blob ---- */
  async openNestedArchive(entry, fullPath) {
    try {
      // 随机通道号，避免多个窗口串台
      const chId = 'n' + Date.now() + Math.floor(Math.random() * 100000);
      // 关键：window.open 必须在用户点击的激活期内同步执行（不能放在 await 之后，
      // 否则激活过期会被浏览器拦截、甚至退化为当前标签跳转）
      const w = window.open('index.html?nested=1&ch=' + chId + '#nested', '_blank');
      // 注意：部分浏览器（或多进程/隐私模式）窗口已成功打开但拿不到引用（w 为 null），
      // 不能因此放弃——继续建通道，子窗口会发 ready 完成握手；
      // 若窗口真的被拦截（没有任何 ready），下方 10 秒超时会兜底提示
      RingProgress.show('正在读取嵌套压缩包...');
      // 窗口已打开，再读取数据（子窗口会周期发 ready，数据就绪后握手）
      const blob = await this.getEntryBlob(entry);
      const name = fullPath.split('/').pop();
      // BroadcastChannel 不依赖 window.opener（部分浏览器/隐私模式会清空 opener），
      // postMessage 作为第二条通道，双保险
      let channel = null;
      try { channel = new BroadcastChannel('nested-archive-' + chId); } catch {}
      let done = false;
      const finish = () => {
        if (done) return; done = true;
        this._nestedWaiting = false;
        try { channel && channel.close(); } catch {}
        window.removeEventListener('message', onMsg);
        RingProgress.hide();
      };
      const sendData = () => {
        const payload = { type: 'nested-data', name, blob };
        try { w.postMessage(payload, location.origin); } catch {}
        try { channel && channel.postMessage(payload); } catch {}
      };
      // ready：子窗口已绑定监听（会周期重发，每次都回 data）；ack：数据已收到
      const onMsg = (ev) => {
        const t = ev.data && ev.data.type;
        if (t === 'nested-ready') {
          sendData();
        } else if (t === 'nested-ack') {
          finish();
        }
      };
      window.addEventListener('message', onMsg);
      if (channel) channel.onmessage = onMsg;
      // 兜底：10 秒未就绪则提示
      setTimeout(() => {
        if (!done) {
          finish();
          this.showToast('新窗口被拦截或加载失败，请允许弹窗后重试');
        }
      }, 10000);
      this._nestedWaiting = true;
    } catch(e) {
      RingProgress.hide();
      this.showToast('打开失败: ' + (e.message || e));
    }
  },

  /* ---- 单个文件下载（手机端逐个下载用） ---- */
  async downloadOneFile(fullPath) {
    const entry = this.zipEntries.find(e => e.filename === fullPath);
    if (!entry) return;
    const name = fullPath.split('/').pop();
    try {
      this.showProgress('extract', 0, '正在读取文件...');
      const blob = await this.getEntryBlob(entry);
      this.hideProgress('extract');
      // 统一弹确认框：在用户手势内触发下载，手机浏览器不会丢下载
      this.requestDownload(blob, name);
    } catch(e) {
      this.hideProgress('extract');
      this.showToast('下载失败: ' + (e.message || e));
    }
  },

  closePreview() { Preview.close(); },

  togglePreviewSize() { Preview.toggleSize(); },

  /* ---- Drag file from tree to extract ---- */
  treeDragPath: null,
  prepareDrag(path) {
    this.treeDragPath = path;
    const entry = this.zipEntries.find(e => e.filename === path);
    if (!entry || this.dragCache[path]) return;
    // 预解压，缓存 blob URL（用户通常会在几百毫秒内拖动）
    this.getEntryBlob(entry).then(blob => {
      const name = path.split('/').pop();
      this.dragCache[path] = { url: URL.createObjectURL(blob), type: blob.type, name };
    }).catch(() => {});
  },
  dragCache: {},
  onTreeDragStart(event, path) {
    this.treeDragPath = path;
    const entry = this.zipEntries.find(e => e.filename === path);
    if (!entry) return;
    event.dataTransfer.effectAllowed = 'copy';
    const name = path.split('/').pop();
    // 优先用缓存的 blob URL
    const cached = this.dragCache[path];
    if (cached) {
      event.dataTransfer.setData('DownloadURL', cached.type + ':' + name + ':' + cached.url);
      return;
    }
    // 先设置一个占位（Chrome 需要至少一种数据才能拖动）
    event.dataTransfer.setData('text/plain', name);
    // 异步解压并缓存（用户拖到目标时通常已完成）
    this.getEntryBlob(entry).then(blob => {
      const url = URL.createObjectURL(blob);
      this.dragCache[path] = { url, type: blob.type, name };
      event.dataTransfer.setData('DownloadURL', blob.type + ':' + name + ':' + url);
    }).catch(() => {});
  },

  /* ---- Extract: actions ---- */
  stripArchiveExt(name) {
    return name.replace(/\.(zip|zipx|rar|7z|tar|gz|tgz|bz2|xz|iso|apk|jar|exe|tar\.gz|tar\.bz2|tar\.xz)$/i, '');
  },

  isMobileDevice() {
    return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
  },

  async extractToDir() {
    if (!this.zipEntries.length) return;
    if (!('showDirectoryPicker' in window)) {
      // 不支持目录写入：只引导逐个下载，绝不重新打包
      this.showToast('当前浏览器不支持直接解压到目录：请点每个文件右侧的 ⬇ 逐个下载', 4000);
      return;
    }
    try {
      const dirHandle = await window.showDirectoryPicker({ mode: 'readwrite' });
      const baseName = this.stripArchiveExt(this.extractFile.name);
      const targetHandle = await this.getOrCreateDirectory(dirHandle, baseName);
      await this.doExtract(targetHandle);
    } catch (e) {
      if (e.name !== 'AbortError') {
        this.showToast('解压失败: ' + (e.message || e));
      }
    }
  },

  async extractToDesktop() {
    if (!this.zipEntries.length) return;
    if (!('showDirectoryPicker' in window)) {
      this.showToast('当前浏览器不支持直接解压到目录：请点每个文件右侧的 ⬇ 逐个下载', 4000);
      return;
    }
    try {
      // startIn: 'desktop' 默认定位到桌面；mode: 'readwrite' 申请写入权限
      const dirHandle = await window.showDirectoryPicker({ startIn: 'desktop', mode: 'readwrite' });
      const baseName = this.stripArchiveExt(this.extractFile.name);
      const targetHandle = await this.getOrCreateDirectory(dirHandle, baseName);
      await this.doExtract(targetHandle);
    } catch (e) {
      if (e.name !== 'AbortError') {
        this.showToast('解压失败: ' + (e.message || e));
      }
    }
  },

  resetExtract() {
    // 离开文件列表：关闭可能开着的预览，静默移除返回守卫
    if (Preview.isOpen()) Preview.close();
    ExitGuard.disarm();
    if (this.zipReader) {
      this.zipReader.close().catch(() => {});
      this.zipReader = null;
    }
    // 清理 sevenzip 虚拟文件系统
    if (this.szInstance) {
      try {
        const FS = this.szInstance.FS;
        try { FS.unlink('/input.archive'); } catch {}
        try { this.szRmdirRecursive('/extracted'); } catch {}
      } catch {}
    }
    this.zipEntries = [];
    this.treeData = null;
    this.extractFile = null;
    this.archiveFormat = null;
    this.archivePassword = null;
    document.getElementById('extract-input').value = '';
    document.getElementById('extract-drop').style.display = 'block';
    document.getElementById('extract-tree').style.display = 'none';
    document.getElementById('extract-bar').style.display = 'none';
    this.hideFileInfo('extract-info');
    this.hideProgress('extract');
  },

  async doExtract(targetDirHandle) {
    const entries = this.zipEntries.filter(e => !e.directory);
    const total = entries.length;
    let failed = 0;
    this.showProgress('extract', 0, '准备解压...');
    for (let i = 0; i < total; i++) {
      const entry = entries[i];
      let pw = null;
      if (entry.encrypted) {
        if (this.archivePassword !== null && this.archivePassword !== undefined) {
          pw = this.archivePassword;
        } else {
          pw = await this.askPassword(entry);
          if (pw === null) { this.hideProgress('extract'); return; }
          this.archivePassword = pw;
        }
      }
      try {
        await this.extractEntry(entry, targetDirHandle, pw);
      } catch (e) {
        console.warn('解压条目失败:', entry.filename, e);
        failed++;
      }
      this.showProgress('extract', Math.round(((i + 1) / total) * 100), `解压中 ${i+1}/${total}`);
    }
    this.hideProgress('extract');
    if (failed) {
      this.showToast(`完成，但有 ${failed} 个文件失败`);
    } else {
      // 解压到文件夹全部成功：弹出致谢 + 捐赠询问（可一键关闭）
      this.showSupportDialog('extract');
    }
  },

  async extractEntry(entry, dirHandle, password) {
    const parts = entry.filename.split('/').filter(Boolean);
    if (parts.length === 0) return;
    let current = dirHandle;
    for (let i = 0; i < parts.length - 1; i++) {
      current = await this.getOrCreateDirectory(current, parts[i]);
    }
    const fileName = parts[parts.length - 1];
    const fileHandle = await current.getFileHandle(fileName, { create: true });
    const writable = await fileHandle.createWritable();
    try {
      const blob = await this.getEntryBlob(entry, password);
      await writable.write(blob);
    } finally {
      await writable.close();
    }
  },

  // 统一从不同来源获取条目数据
  async getEntryBlob(entry, password) {
    if (entry._source === 'zip') {
      return entry._zipEntry.getData(new zip.BlobWriter(), { password: password || undefined });
    }
    if (entry._source === 'tar') {
      return entry._tarFile.slice(entry._tarOffset, entry._tarOffset + entry._tarSize);
    }
    if (entry._source === 'gz') {
      return new Blob([entry._gzData]);
    }
    if (entry._source === 'sevenzip') {
      const FS = this.szInstance.FS;
      const data = FS.readFile(entry._szPath);
      return new Blob([data]);
    }
    throw new Error('未知的数据源');
  },

  async getOrCreateDirectory(parentHandle, name) {
    return await parentHandle.getDirectoryHandle(name, { create: true });
  },

  /* ---- Password ---- */
  askPassword(entry) {
    this.pendingPasswordEntry = entry;
    return new Promise((resolve) => {
      this.pendingPasswordResolve = resolve;
      document.getElementById('password-input').value = '';
      document.getElementById('password-modal').classList.add('active');
      setTimeout(() => document.getElementById('password-input').focus(), 100);
    });
  },

  confirmPassword() {
    const val = document.getElementById('password-input').value;
    document.getElementById('password-modal').classList.remove('active');
    if (this.pendingPasswordResolve) {
      this.pendingPasswordResolve(val || null);
      this.pendingPasswordResolve = null;
    }
  },

  cancelPassword() {
    document.getElementById('password-modal').classList.remove('active');
    if (this.pendingPasswordResolve) {
      this.pendingPasswordResolve(null);
      this.pendingPasswordResolve = null;
    }
  },

  /* ---- Compress ---- */
  onCompressFilesSelect(fileList) {
    if (!fileList || !fileList.length) return;
    for (const file of fileList) {
      // 拖拽的文件夹文件已在 getDroppedFiles 里带相对路径 _path，必须保留；
      // webkitRelativePath 只有目录选择器才有，拖拽文件上恒为空，不能拿来覆盖
      const path = file._path || file.webkitRelativePath || file.name;
      if (!this.compressFiles.some(f => f._path === path)) {
        file._path = path;
        file._id = Math.random().toString(36).slice(2);
        this.compressFiles.push(file);
      }
    }
    this.renderCompressList();
    this.showToast(`已添加 ${fileList.length} 个文件`);
  },

  renderCompressList() {
    const container = document.getElementById('compress-list');
    if (!this.compressFiles.length) {
      container.style.display = 'none';
      return;
    }
    container.style.display = 'block';
    let html = '';
    for (const file of this.compressFiles) {
      const selected = this.selectedCompressIds.has(file._id) ? 'selected' : '';
      const isDir = file.type === '' && file.size === 0 && file.name.indexOf('.') === -1;
      html += `
        <div class="file-list-item ${selected}" onclick="app.toggleCompressSelect('${file._id}',event)">
          <span class="f-icon">${isDir ? '📁' : this.getFileIcon(file.name)}</span>
          <span class="f-name">${this.escapeHtml(file._path)}</span>
          <span class="f-size">${this.formatSize(file.size)}</span>
        </div>`;
    }
    container.innerHTML = html;
  },

  toggleCompressSelect(id, event) {
    event.stopPropagation();
    if (this.selectedCompressIds.has(id)) {
      this.selectedCompressIds.delete(id);
    } else {
      this.selectedCompressIds.add(id);
    }
    this.renderCompressList();
  },

  removeSelectedCompress() {
    if (!this.selectedCompressIds.size) {
      this.showToast('请先选中要删除的文件');
      return;
    }
    this.compressFiles = this.compressFiles.filter(f => !this.selectedCompressIds.has(f._id));
    this.selectedCompressIds.clear();
    this.renderCompressList();
    this.showToast('已删除');
  },

  onFormatChange() {
    const format = document.getElementById('compress-format').value;
    const pwRow = document.getElementById('compress-password').closest('.password-row');
    const levelRow = document.getElementById('compress-level').closest('.password-row');
    const zip64Row = document.getElementById('compress-zip64').closest('label');
    if (format === 'zip') {
      pwRow.style.display = 'flex';
      levelRow.style.display = 'flex';
      zip64Row.style.display = 'flex';
    } else if (format === 'tar') {
      pwRow.style.display = 'none';
      levelRow.style.display = 'none';
    } else if (format === 'tgz') {
      pwRow.style.display = 'none';
      levelRow.style.display = 'flex';
    } else if (format === '7z') {
      pwRow.style.display = 'flex';
      levelRow.style.display = 'flex';
      zip64Row.style.display = 'none';
    }
  },

  resetCompress() {
    // 清理 7z 压缩用实例的虚拟文件系统（/in、/tmp/output.7z）
    if (this._compressSz) {
      try {
        const FS = this._compressSz.FS;
        try { FS.unlink('/tmp/output.7z'); } catch {}
        try {
          const rm = (p) => {
            for (const it of FS.readdir(p)) {
              if (it === '.' || it === '..') continue;
              const q = p + '/' + it;
              const st = FS.stat(q);
              if (FS.isDir(st.mode)) rm(q); else FS.unlink(q);
            }
            FS.rmdir(p);
          };
          rm('/in');
        } catch {}
      } catch {}
      this._compressSz = null;
    }
    this.compressFiles = [];
    this.selectedCompressIds.clear();
    document.getElementById('compress-file-input').value = '';
    document.getElementById('compress-dir-input').value = '';
    document.getElementById('compress-password').value = '';
    document.getElementById('compress-format').value = 'zip';
    this.onFormatChange();
    this.renderCompressList();
    this.hideFileInfo('compress-info');
    this.hideProgress('compress');
  },

  async startCompress() {
    if (!this.compressFiles.length) {
      this.showToast('请先添加文件');
      return;
    }
    const format = document.getElementById('compress-format').value;
    const password = document.getElementById('compress-password').value.trim() || undefined;
    const level = parseInt(document.getElementById('compress-level').value, 10);
    const useZip64 = document.getElementById('compress-zip64').checked;
    try {
      this.showProgress('compress', 0, '正在压缩...');
      let blob, ext;
      if (format === 'zip') {
        blob = await this.compressZip(password, level, useZip64);
        ext = '.zip';
      } else if (format === 'tar') {
        blob = await this.compressTar();
        ext = '.tar';
      } else if (format === 'tgz') {
        blob = await this.compressTgz(level);
        ext = '.tar.gz';
      } else if (format === '7z') {
        blob = await this.compress7z(password, level);
        ext = '.7z';
      } else {
        throw new Error('未知格式: ' + format);
      }
      this.hideProgress('compress');
      const outName = 'XPZ-' + this.timestamp() + ext;
      this.downloadBlob(blob, outName);
      this.showSupportDialog('compress', blob, outName);
      // 显示哈希信息
      this.computeHashes(blob).then(hashes => {
        this.showFileInfo('compress-info', outName, blob.size, hashes);
      }).catch(err => console.error('哈希计算失败:', err));
    } catch (e) {
      this.hideProgress('compress');
      this.showToast('压缩失败: ' + (e.message || e));
      console.error(e);
    }
  },

  async compressZip(password, level, useZip64) {
    const zipWriter = new zip.ZipWriter(new zip.BlobWriter('application/zip'), {
      zip64: useZip64,
      level: level
    });
    const total = this.compressFiles.length;
    for (let i = 0; i < total; i++) {
      const file = this.compressFiles[i];
      await zipWriter.add(file._path, new zip.BlobReader(file), { password, level });
      this.showProgress('compress', Math.round(((i + 1) / total) * 100), `压缩中 ${i+1}/${total}`);
    }
    return zipWriter.close();
  },

  async compressTar() {
    const chunks = [];
    const total = this.compressFiles.length;
    for (let i = 0; i < total; i++) {
      const file = this.compressFiles[i];
      const data = new Uint8Array(await file.arrayBuffer());
      const path = file._path;
      // 写 TAR 头
      chunks.push(this.buildTarHeader(path, data.length, 0o644));
      chunks.push(data);
      // 512 字节对齐填充
      const pad = (512 - (data.length % 512)) % 512;
      if (pad > 0) chunks.push(new Uint8Array(pad));
      this.showProgress('compress', Math.round(((i + 1) / total) * 100), `打包中 ${i+1}/${total}`);
    }
    // 结尾两个空块
    chunks.push(new Uint8Array(1024));
    return new Blob(chunks, { type: 'application/x-tar' });
  },

  async compressTgz(level) {
    const gz = new fflate.Gzip({ level });
    const chunks = [];
    gz.ondata = (chunk, final) => chunks.push(chunk);
    const total = this.compressFiles.length;
    for (let i = 0; i < total; i++) {
      const file = this.compressFiles[i];
      const data = new Uint8Array(await file.arrayBuffer());
      const path = file._path;
      gz.push(this.buildTarHeader(path, data.length, 0o644));
      gz.push(data);
      const pad = (512 - (data.length % 512)) % 512;
      if (pad > 0) gz.push(new Uint8Array(pad));
      this.showProgress('compress', Math.round(((i + 1) / total) * 100), `压缩中 ${i+1}/${total}`);
    }
    gz.push(new Uint8Array(1024), true);
    return new Blob(chunks, { type: 'application/gzip' });
  },

  async compress7z(password, level) {
    // 懒加载 sevenzip-wasm
    if (typeof SevenZipWasm === 'undefined') {
      await this.loadScript('sevenzip-wasm.js?v=202610075');
    }
    const sevenZip = await SevenZipWasm({
      printErr: () => {} // 静默 stderr
    });
    const FS = sevenZip.FS;
    // 写入虚拟文件系统，用 /in/ 作为根目录避免路径前缀
    FS.mkdirTree('/in');
    for (const file of this.compressFiles) {
      const data = new Uint8Array(await file.arrayBuffer());
      const path = '/in/' + file._path;
      const dir = path.substring(0, path.lastIndexOf('/'));
      if (dir) FS.mkdirTree(dir);
      FS.writeFile(path, data);
    }
    // 记住压缩用实例，回家/重置时清理它的虚拟 FS
    this._compressSz = sevenZip;
    // 进入 /in 目录再压缩，避免压缩包内出现 in/ 前缀
    FS.chdir('/in');
    // 构建 7z 命令
    const args = ['a', '/tmp/output.7z', '-t7z', `-mx=${level}`];
    if (password) args.push(`-p${password}`, '-mhe=on');
    args.push('-r', '.');
    try {
      sevenZip.callMain(args);
    } catch (e) {
      // callMain 正常退出也会 throw，检查是否有输出文件
      try {
        FS.stat('/tmp/output.7z');
      } catch {
        throw e;
      }
    }
    const output = FS.readFile('/tmp/output.7z');
    return new Blob([output], { type: 'application/x-7z-compressed' });
  },

  async compressIso() {
    // ISO 9660 Level 1 生成器（真正的 ISO 格式）
    const SECTOR = 2048;
    const files = [];
    for (const file of this.compressFiles) {
      const data = new Uint8Array(await file.arrayBuffer());
      files.push({ name: this.toIsoName(file._path), data, size: data.length });
    }

    // 辅助函数
    const wLE4 = (buf, off, v) => { buf[off] = v; buf[off+1] = v>>8; buf[off+2] = v>>16; buf[off+3] = v>>24; };
    const wBE4 = (buf, off, v) => { buf[off+3] = v; buf[off+2] = v>>8; buf[off+1] = v>>16; buf[off] = v>>24; };
    const wBoth4 = (buf, off, v) => { wLE4(buf, off, v); wBE4(buf, off+4, v); };
    const wBoth2 = (buf, off, v) => { buf[off] = v; buf[off+1] = v>>8; buf[off+2] = v>>8; buf[off+3] = v; };
    const enc = new TextEncoder();
    const now = new Date();
    const dt = new Uint8Array([now.getFullYear()-1900, now.getMonth()+1, now.getDate(), now.getHours(), now.getMinutes(), now.getSeconds(), 8]);

    // 构建目录记录
    const buildDir = (name, lba, size, isDir) => {
      const n = enc.encode(name);
      const len = 33 + n.length + (n.length % 2 === 0 ? 1 : 0);
      const r = new Uint8Array(len);
      r[0] = len;
      r[1] = 0;
      wLE4(r, 2, lba); wBE4(r, 6, lba);
      wLE4(r, 10, size); wBE4(r, 14, size);
      r.set(dt, 18);
      r[25] = isDir ? 0x02 : 0x00;
      r[26] = 0; r[27] = 0;
      wBoth2(r, 28, 1);
      r[32] = n.length;
      r.set(n, 33);
      if (n.length % 2 === 0) { r[33 + n.length] = 0; } // 仅偶数长度需要填充
      return r;
    };

    // 计算根目录大小
    const rootEntries = [
      buildDir('\x00', 0, 0, true), // placeholder for "."
      buildDir('\x01', 0, 0, true), // placeholder for ".."
    ];
    for (const f of files) rootEntries.push(buildDir(f.name, 0, f.size, false));
    const rootDirLen = rootEntries.reduce((s, r) => s + r.length, 0);
    const rootSectors = Math.ceil(rootDirLen / SECTOR);

    // 布局（扇区号）：
    // 0-15: 系统区
    // 16: 主卷描述符
    // 17: 终止描述符
    // 18: 路径表
    // 19: 根目录
    // 20+: 文件数据
    const pathTableLba = 18;
    const rootLba = 19;
    let dataLba = rootLba + rootSectors;
    for (const f of files) { f.lba = dataLba; dataLba += Math.ceil(f.size / SECTOR); }
    const totalSectors = dataLba;

    // 重新生成根目录记录（用正确的 LBA）
    const finalRootEntries = [
      buildDir('\x00', rootLba, rootDirLen, true),
      buildDir('\x01', rootLba, rootDirLen, true),
    ];
    for (const f of files) finalRootEntries.push(buildDir(f.name, f.lba, f.size, false));
    const finalRootLen = finalRootEntries.reduce((s, r) => s + r.length, 0);
    const rootDirData = new Uint8Array(Math.ceil(finalRootLen / SECTOR) * SECTOR);
    let p = 0;
    for (const r of finalRootEntries) { rootDirData.set(r, p); p += r.length; }

    // 路径表（单级：只有根目录）
    const pathTableSize = 10;
    const pathTable = new Uint8Array(pathTableSize);
    pathTable[0] = 1; // 目录标识符长度
    pathTable[1] = 0; // 扩展属性记录长度
    wLE4(pathTable, 2, rootLba); // LBA
    pathTable[6] = 1; pathTable[7] = 0; // 父目录号 (小端)
    pathTable[8] = 0; // 根目录名 (\0)
    pathTable[9] = 0; // padding to even

    // 卷描述符
    const volDesc = new Uint8Array(SECTOR);
    volDesc[0] = 1; // Primary Volume Descriptor
    enc.encode('CD001').forEach((b, i) => volDesc[1+i] = b);
    volDesc[6] = 1;
    enc.encode('LINUX').forEach((b, i) => volDesc[8+i] = b);
    const volId = enc.encode('XPZ_ISO'.padEnd(32, ' '));
    volId.forEach((b, i) => volDesc[40+i] = b);
    wBoth4(volDesc, 80, totalSectors);
    enc.encode('0'.repeat(32)).forEach((b, i) => volDesc[88+i] = b);
    wBoth2(volDesc, 120, 1);
    wBoth2(volDesc, 124, 1);
    wBoth2(volDesc, 128, SECTOR);
    wBoth4(volDesc, 132, pathTableSize);
    wLE4(volDesc, 140, pathTableLba);
    wLE4(volDesc, 144, pathTableLba);
    // Root directory record in vol desc (byte 156)
    const rootInVol = buildDir('\x00', rootLba, finalRootLen, true);
    volDesc.set(rootInVol, 156);
    enc.encode('XPZ'.padEnd(128, ' ')).forEach((b, i) => volDesc[190+i] = b);
    enc.encode('XPZ'.padEnd(128, ' ')).forEach((b, i) => volDesc[318+i] = b);
    enc.encode('XPZ'.padEnd(128, ' ')).forEach((b, i) => volDesc[446+i] = b);
    enc.encode('XPZ'.padEnd(128, ' ')).forEach((b, i) => volDesc[574+i] = b);
    volDesc[813] = 1;

    // 终止描述符
    const termDesc = new Uint8Array(SECTOR);
    termDesc[0] = 255;
    enc.encode('CD001').forEach((b, i) => termDesc[1+i] = b);
    termDesc[6] = 1;

    // 组装
    const chunks = [];
    for (let i = 0; i < 16; i++) chunks.push(new Uint8Array(SECTOR));
    chunks.push(volDesc);
    chunks.push(termDesc);
    const ptPadded = new Uint8Array(SECTOR);
    ptPadded.set(pathTable);
    chunks.push(ptPadded);
    chunks.push(rootDirData);
    for (const f of files) {
      const padded = new Uint8Array(Math.ceil(f.size / SECTOR) * SECTOR);
      padded.set(f.data);
      chunks.push(padded);
    }
    // 用单一 ArrayBuffer 避免 Chrome Blob 分块 bug
    const totalSize = chunks.reduce((s, c) => s + c.length, 0);
    const singleBuf = new Uint8Array(totalSize);
    let off = 0;
    for (const c of chunks) { singleBuf.set(c, off); off += c.length; }
    return new Blob([singleBuf], { type: 'application/x-iso9660-image' });
  },

  toIsoName(path) {
    // ISO Level 1: 大写 8.3 格式
    const base = path.split('/').pop().split('\\').pop();
    const dot = base.lastIndexOf('.');
    const name = dot > 0 ? base.substring(0, dot).toUpperCase() : base.toUpperCase();
    const ext = dot > 0 ? base.substring(dot + 1).toUpperCase() : '';
    const shortName = name.substring(0, 8);
    const shortExt = ext.substring(0, 3);
    return shortExt ? shortName + '.' + shortExt : shortName;
  },

  loadScript(src) {
    return new Promise((resolve, reject) => {
      if (document.querySelector(`script[src="${src}"]`)) { resolve(); return; }
      const s = document.createElement('script');
      s.src = src;
      s.onload = resolve;
      s.onerror = () => reject(new Error('加载失败: ' + src));
      document.head.appendChild(s);
    });
  },

  buildTarHeader(name, size, mode) {
    const buf = new Uint8Array(512);
    const writeStr = (s, offset, len) => {
      const enc = new TextEncoder().encode(s);
      buf.set(enc.subarray(0, Math.min(enc.length, len)), offset);
    };
    const writeOctal = (num, offset, len) => {
      writeStr(num.toString(8).padStart(len - 1, '0'), offset, len - 1);
    };
    writeStr(name, 0, 100);           // 文件名
    writeOctal(mode, 100, 8);         // mode
    writeOctal(0, 108, 8);            // uid
    writeOctal(0, 116, 8);            // gid
    writeOctal(size, 124, 12);        // size
    writeOctal(Math.floor(Date.now() / 1000), 136, 12); // mtime
    // 校验和：先填空格再计算
    for (let i = 148; i < 156; i++) buf[i] = 32;
    writeStr('ustar', 257, 6);        // magic
    writeStr('00', 263, 2);           // version
    writeStr('root', 265, 32);        // uname
    writeStr('root', 297, 32);        // gname
    // typeflag '0' = 普通文件
    buf[156] = 48;
    // 计算校验和
    let sum = 0;
    for (let i = 0; i < 512; i++) sum += buf[i];
    writeStr(sum.toString(8).padStart(6, '0'), 148, 6);
    return buf;
  },

  timestamp() {
    const d = new Date();
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}${p(d.getHours())}${p(d.getMinutes())}`;
  },

  /* ---- Drag & Drop ---- */
  setupDragDrop() {
    const extractDrop = document.getElementById('extract-drop');
    const compressDrop = document.getElementById('compress-drop');

    const stop = (e) => { e.preventDefault(); e.stopPropagation(); };

    extractDrop.addEventListener('dragenter', stop);
    extractDrop.addEventListener('dragover', (e) => { stop(e); extractDrop.classList.add('dragover'); });
    extractDrop.addEventListener('dragleave', (e) => { stop(e); extractDrop.classList.remove('dragover'); });
    extractDrop.addEventListener('drop', async (e) => {
      stop(e); extractDrop.classList.remove('dragover');
      const files = await this.getDroppedFiles(e.dataTransfer);
      const zipFile = files.find(f => this.isArchiveFile(f.name));
      if (zipFile) this.onExtractFileSelect(zipFile);
      else this.showToast('请拖入压缩文件（ZIP/RAR/7z/TAR 等）');
    });

    compressDrop.addEventListener('dragenter', stop);
    compressDrop.addEventListener('dragover', (e) => { stop(e); compressDrop.classList.add('dragover'); });
    compressDrop.addEventListener('dragleave', (e) => { stop(e); compressDrop.classList.remove('dragover'); });
    compressDrop.addEventListener('drop', async (e) => {
      stop(e); compressDrop.classList.remove('dragover');
      const files = await this.getDroppedFiles(e.dataTransfer);
      if (files.length) this.onCompressFilesSelect(files);
    });
  },

  isArchiveFile(name) {
    const n = name.toLowerCase();
    return n.endsWith('.zip') || n.endsWith('.rar') || n.endsWith('.7z') ||
           n.endsWith('.tar') || n.endsWith('.tgz') ||
           n.endsWith('.apk') || n.endsWith('.jar') ||
           n.endsWith('.exe') || n.endsWith('.iso');
  },

  async getDroppedFiles(dataTransfer) {
    const files = [];
    const items = dataTransfer.items;
    const dirEntries = [];
    if (items && items.length) {
      for (let i = 0; i < items.length; i++) {
        const item = items[i];
        if (item.kind && item.kind !== 'file') continue;
        const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
        if (entry && entry.isDirectory) {
          dirEntries.push(entry);
        } else {
          const file = item.getAsFile ? item.getAsFile() : null;
          if (file) { file._path = file.name; files.push(file); }
        }
      }
    }
    if (!files.length && !dirEntries.length && dataTransfer.files.length) {
      for (const f of dataTransfer.files) { f._path = f.name; files.push(f); }
    }
    for (const dir of dirEntries) {
      await this.traverseEntry(dir, files, '');
    }
    return files;
  },

  traverseEntry(entry, files, path) {
    return new Promise((resolve) => {
      if (entry.isFile) {
        entry.file(file => {
          file._path = path + file.name;
          files.push(file);
          resolve();
        }, () => resolve());
      } else if (entry.isDirectory) {
        const dirReader = entry.createReader();
        const allEntries = [];
        const readBatch = () => {
          // readEntries 每次最多返回 100 条，必须循环读到空为止
          dirReader.readEntries(async (batch) => {
            if (batch.length) {
              allEntries.push(...batch);
              readBatch();
            } else {
              for (const e of allEntries) {
                await this.traverseEntry(e, files, path + entry.name + '/');
              }
              resolve();
            }
          }, () => resolve());
        };
        readBatch();
      } else {
        resolve();
      }
    });
  },

  /* ---- Progress ---- */
  showProgress(type, percent, text) {
    document.getElementById(`${type}-progress`).style.display = 'block';
    document.getElementById(`${type}-progress-fill`).style.width = percent + '%';
    document.getElementById(`${type}-progress-text`).textContent = text;
  },

  hideProgress(type) {
    document.getElementById(`${type}-progress`).style.display = 'none';
    document.getElementById(`${type}-progress-fill`).style.width = '0%';
  },

  /* ---- Utilities ---- */
  downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => {
      URL.revokeObjectURL(url);
      a.remove();
    }, 100);
  },

  /* ---- 手机端：异步准备好文件后，弹窗让用户在手势内点下载 ---- */
  pendingDownload: null,
  requestDownload(blob, filename) {
    this.pendingDownload = { blob, filename };
    document.getElementById('download-modal-name').textContent = filename + '（' + this.formatSize(blob.size) + '）';
    document.getElementById('download-modal').classList.add('active');
  },
  confirmDownload() {
    const d = this.pendingDownload;
    document.getElementById('download-modal').classList.remove('active');
    this.pendingDownload = null;
    if (d) this.downloadBlob(d.blob, d.filename);
  },
  cancelDownload() {
    document.getElementById('download-modal').classList.remove('active');
    this.pendingDownload = null;
  },

  /* ---- 完成 + 捐赠询问：压缩/解压完成后弹出，一键关闭，不强制打断 ---- */
  supportInfo: null,
  showSupportDialog(kind, blob, filename) {
    // kind: 'compress' | 'extract'；compress 附带 blob，供手动补下载防拦截
    this.supportInfo = (kind === 'compress' && blob) ? { blob, filename } : null;
    document.getElementById('support-download-btn').style.display = this.supportInfo ? '' : 'none';
    document.getElementById('support-title').textContent = kind === 'compress' ? '🎉 压缩完毕' : '🎉 解压完毕';
    document.getElementById('support-text').textContent = kind === 'compress'
      ? '将自动触发下载。如果觉得好用，可以考虑支持我们，感谢每一份心意！'
      : '文件已保存到所选文件夹。如果觉得好用，可以考虑支持我们，感谢每一份心意！';
    document.getElementById('support-modal').classList.add('active');
  },
  supportDownload() {
    const info = this.supportInfo;
    document.getElementById('support-modal').classList.remove('active');
    this.supportInfo = null;
    if (info) this.downloadBlob(info.blob, info.filename); // 用户手势内手动补一次下载
  },
  supportDonate() {
    document.getElementById('support-modal').classList.remove('active');
    this.supportInfo = null;
    this.openDonate();
  },
  supportClose() {
    document.getElementById('support-modal').classList.remove('active');
    this.supportInfo = null;
  },
  openDonate() {
    document.getElementById('donate-modal').classList.add('active');
  },
  closeDonate() {
    document.getElementById('donate-modal').classList.remove('active');
  },

  // 修复 Chrome Blob bug：读取 Blob 时确保数据完整
  async blobToArrayBuffer(blob) {
    // Chrome 对 TypedArray 分块的 Blob 有 bug，arrayBuffer() 可能返回全零
    // 使用 FileReader 或 slice 来规避
    try {
      const buf = await blob.arrayBuffer();
      // 检查是否全零（前 1024 字节）
      const check = new Uint8Array(buf.slice(0, Math.min(1024, buf.byteLength)));
      if (check.every(b => b === 0) && blob.size > 1024) {
        // 可能是 bug，用 slice 方式重新读取
        const chunks = [];
        let offset = 0;
        const CHUNK = 64 * 1024; // 64KB chunks
        while (offset < blob.size) {
          const slice = blob.slice(offset, offset + CHUNK);
          chunks.push(new Uint8Array(await slice.arrayBuffer()));
          offset += CHUNK;
        }
        const total = chunks.reduce((s, c) => s + c.length, 0);
        const result = new Uint8Array(total);
        let pos = 0;
        for (const c of chunks) { result.set(c, pos); pos += c.length; }
        return result.buffer;
      }
      return buf;
    } catch {
      // 回退到 slice 方式
      const chunks = [];
      let offset = 0;
      const CHUNK = 64 * 1024;
      while (offset < blob.size) {
        const slice = blob.slice(offset, offset + CHUNK);
        chunks.push(new Uint8Array(await slice.arrayBuffer()));
        offset += CHUNK;
      }
      const total = chunks.reduce((s, c) => s + c.length, 0);
      const result = new Uint8Array(total);
      let pos = 0;
      for (const c of chunks) { result.set(c, pos); pos += c.length; }
      return result.buffer;
    }
  },

  formatSize(bytes) {
    if (bytes === undefined || bytes === null) return '';
    if (bytes === 0) return '0 B';
    const k = 1024;
    const sizes = ['B', 'KB', 'MB', 'GB'];
    const i = Math.floor(Math.log(bytes) / Math.log(k));
    return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
  },

  /* ---- 文件类型图标 ---- */
  getFileIcon(name) {
    const ext = name.split('.').pop().toLowerCase();
    const map = {
      // 图片
      jpg:'🖼️', jpeg:'🖼️', png:'🖼️', gif:'🖼️', webp:'🖼️', svg:'🖼️', bmp:'🖼️', ico:'🖼️', avif:'🖼️', heic:'🖼️',
      // 视频
      mp4:'🎬', webm:'🎬', mov:'🎬', mkv:'🎬', avi:'🎬', flv:'🎬', wmv:'🎬', m4v:'🎬', ts:'🎬',
      // 音频
      mp3:'🎵', wav:'🎵', ogg:'🎵', flac:'🎵', m4a:'🎵', aac:'🎵', opus:'🎵', wma:'🎵',
      // 可执行/安装包
      exe:'⚙️', msi:'⚙️', bat:'⚙️', cmd:'⚙️', sh:'⚙️',
      apk:'🤖', ipa:'📱', deb:'📦', rpm:'📦', dmg:'💿', pkg:'📦',
      // 压缩包
      zip:'🗜️', rar:'🗜️', '7z':'🗜️', tar:'🗜️', gz:'🗜️', tgz:'🗜️', bz2:'🗜️', xz:'🗜️', iso:'💿', jar:'🗜️',
      // 文档
      txt:'📝', md:'📝', log:'📝', pdf:'📕', doc:'📘', docx:'📘', xls:'📗', xlsx:'📗', csv:'📗', ppt:'📙', pptx:'📙',
      // 代码
      js:'💻', ts:'💻', jsx:'💻', tsx:'💻', html:'💻', htm:'💻', css:'💻', json:'💻', xml:'💻', py:'💻', c:'💻', cpp:'💻', h:'💻', java:'💻', go:'💻', rs:'💻', php:'💻', yml:'💻', yaml:'💻', toml:'💻', ini:'💻', conf:'💻',
      // 字体
      ttf:'🔤', otf:'🔤', woff:'🔤', woff2:'🔤',
    };
    return map[ext] || '📄';
  },

  getMediaType(name) {
    const ext = name.split('.').pop().toLowerCase();
    if (['jpg','jpeg','png','gif','webp','svg','bmp','ico','avif'].includes(ext)) return 'image';
    if (['mp4','webm','mov','mkv','avi','m4v'].includes(ext)) return 'video';
    if (['mp3','wav','ogg','flac','m4a','aac','opus'].includes(ext)) return 'audio';
    return null;
  },

  escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  },

  escapeAttr(str) {
    return str.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
};

/* ---- Init ---- */
document.addEventListener('DOMContentLoaded', () => {
  app.setupDragDrop();
  // 浏览器兼容性检测：仅控制台记录，不打扰用户；实际操作时再针对性提示
  const issues = [];
  if (!window.showDirectoryPicker) issues.push('File System Access API（无法直接解压到本地目录，可逐个下载）');
  if (!window.WebAssembly) issues.push('WebAssembly（无法解压 RAR/7z 格式）');
  if (!crypto.subtle) issues.push('Web Crypto API（无法计算哈希值）');
  if (issues.length > 0) console.warn('[小破站解压] 当前环境限制: ' + issues.join('；'));

  /* ---- 退出网页（关闭/刷新/跳转）：统一清理残留，干干净净 ---- */
  const cleanupAll = () => {
    try {
      // 停掉媒体并释放预览 URL
      Preview._teardown();
      // 关闭 ZIP reader
      if (app.zipReader) { try { app.zipReader.close(); } catch {} app.zipReader = null; }
      // 清理解压 WASM 虚拟 FS
      if (app.szInstance) {
        const FS = app.szInstance.FS;
        try { FS.unlink('/input.archive'); } catch {}
        try { app.szRmdirRecursive('/extracted'); } catch {}
      }
      // 清理压缩 WASM 虚拟 FS
      if (app._compressSz) {
        const FS = app._compressSz.FS;
        try { FS.unlink('/tmp/output.7z'); } catch {}
        try {
          const rm = p => {
            for (const it of FS.readdir(p)) {
              if (it === '.' || it === '..') continue;
              const q = p + '/' + it;
              if (FS.isDir(FS.stat(q).mode)) rm(q); else FS.unlink(q);
            }
            FS.rmdir(p);
          };
          rm('/in');
        } catch {}
      }
    } catch {}
  };
  // pagehide 覆盖关闭标签、跳转、刷新（含手机浏览器），切后台不清理
  window.addEventListener('pagehide', cleanupAll);

  /* ---- 嵌套压缩包子窗口模式 ---- */
  if (location.search.includes('nested=1') || location.hash === '#nested') {
    // 通道号由父窗口通过 URL 传入；BroadcastChannel 不依赖 window.opener
    const chId = new URLSearchParams(location.search).get('ch');
    let nestedChannel = null;
    if (chId) {
      try { nestedChannel = new BroadcastChannel('nested-archive-' + chId); } catch {}
    }
    let handled = false;
    // 等待父窗口数据期间先盖住页面，避免用户对着空白页以为卡死
    RingProgress.show('正在打开嵌套压缩包...');
    // ready 周期重发：首次 ready/data 任何一个丢失都能自动补上，直到收到 data
    let readyCount = 0;
    const readyTimer = setInterval(() => {
      readyCount++;
      try { nestedChannel && nestedChannel.postMessage({ type: 'nested-ready' }); } catch {}
      try { window.opener && window.opener.postMessage({ type: 'nested-ready' }, location.origin); } catch {}
      if (handled) clearInterval(readyTimer);
      if (readyCount >= 20) {
        clearInterval(readyTimer);
        if (!handled) {
          RingProgress.hide();
          app.showToast('嵌套压缩包加载失败，请回到原窗口重试');
        }
      }
    }, 500);
    const handleNestedData = (d) => {
      if (handled || !d || d.type !== 'nested-data' || !d.blob) return;
      handled = true;
      clearInterval(readyTimer);
      // 回执：数据已收到
      try { nestedChannel && nestedChannel.postMessage({ type: 'nested-ack' }); } catch {}
      try { window.opener && window.opener.postMessage({ type: 'nested-ack' }, location.origin); } catch {}
      app.setMode('extract');
      app.onExtractFileSelect(new File([d.blob], d.name));
    };
    // 两条通道都监听（先绑定再发 ready，杜绝时序竞态）
    window.addEventListener('message', ev => handleNestedData(ev.data));
    if (nestedChannel) nestedChannel.onmessage = ev => handleNestedData(ev.data);
    // 通知父窗口：已就绪（双通道；opener 被清时 BroadcastChannel 仍可达）
    try { window.opener && window.opener.postMessage({ type: 'nested-ready' }, location.origin); } catch {}
    try { nestedChannel && nestedChannel.postMessage({ type: 'nested-ready' }); } catch {}
  }
});
</script>
