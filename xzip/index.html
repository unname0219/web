<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小破站解压</title>
  <script src="lib/zip.min.js?v=202610075"></script>
  <script src="lib/fflate.min.js?v=202610075"></script>
  <link rel="stylesheet" href="lib/github-dark.min.css?v=202610075" id="hljs-dark" media="(prefers-color-scheme: dark)">
  <script src="lib/highlight.min.js?v=202610075"></script>
  <script src="lib/pdf.min.js?v=202610075"></script>
  <script src="lib/mammoth.min.js?v=202610075"></script>
  <script src="lib/xlsx.min.js?v=202610075"></script>
  <script src="preview.js?v=202610075"></script>
  <style>
    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --surface-hover: #f0f0f2;
      --border: #d1d1d6;
      --text: #1c1c1e;
      --text-secondary: #8e8e93;
      --primary: #007aff;
      --primary-hover: #0056b3;
      --danger: #ff3b30;
      --danger-hover: #d9342b;
      --success: #34c759;
      --shadow: 0 2px 12px rgba(0,0,0,0.08);
      --radius: 14px;
      --radius-sm: 8px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --transition: 0.2s ease;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0d0d0f;
        --surface: #1c1c1e;
        --surface-hover: #2c2c2e;
        --border: #3a3a3c;
        --text: #f2f2f7;
        --text-secondary: #8e8e93;
        --primary: #0a84ff;
        --primary-hover: #409cff;
        --danger: #ff453a;
        --danger-hover: #ff6961;
        --success: #30d158;
        --shadow: 0 2px 16px rgba(0,0,0,0.35);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh; /* 动态视口高度：随手机浏览器地址栏/工具栏伸缩 */
      width: 100%;
    }

    /* ===== Header ===== */
    header {
      position: relative;
      flex-shrink: 0;
      padding: 14px 18px;
      padding-top: calc(14px + env(safe-area-inset-top));
      padding-left: calc(18px + env(safe-area-inset-left));
      padding-right: calc(18px + env(safe-area-inset-right));
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      z-index: 10;
    }
    header h1 {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    header .back-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--primary);
      padding: 4px 8px;
      border-radius: var(--radius-sm);
      transition: var(--transition);
    }
    header .back-btn:hover { background: var(--surface-hover); }
    header .spacer { width: 40px; }
    header .donate-btn {
      position: absolute;
      right: calc(18px + env(safe-area-inset-right));
      top: 50%;
      margin-top: -16px;
      background: linear-gradient(135deg, #ff9500, #ff2d55);
      border: none;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      padding: 7px 13px;
      border-radius: 999px;
      cursor: pointer;
      transition: var(--transition);
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(255, 45, 85, 0.3);
      z-index: 11;
    }
    header .donate-btn:hover { filter: brightness(1.1); }

    /* ===== Main Content ===== */
    main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      -webkit-overflow-scrolling: touch;
    }

    /* ===== Drop Zone ===== */
    .drop-zone {
      border: 2.5px dashed var(--border);
      border-radius: var(--radius);
      padding: 48px 24px;
      text-align: center;
      background: var(--surface);
      transition: var(--transition);
      cursor: pointer;
      margin-bottom: 16px;
    }
    .drop-zone.dragover {
      border-color: var(--primary);
      background: color-mix(in srgb, var(--primary) 8%, var(--surface));
    }
    .drop-zone .icon { font-size: 52px; margin-bottom: 12px; display: block; }
    .drop-zone .title { font-size: 17px; font-weight: 600; margin-bottom: 6px; }
    .drop-zone .subtitle { font-size: 13px; color: var(--text-secondary); }

    /* ===== File Tree ===== */
    .file-tree {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .tree-empty {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-secondary);
      font-size: 14px;
    }
    .tree-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .tree-item:last-child { border-bottom: none; }
    .tree-item:hover { background: var(--surface-hover); }
    .tree-item.selected { background: color-mix(in srgb, var(--primary) 12%, var(--surface)); }
    .tree-item .tree-icon { font-size: 20px; margin-right: 10px; flex-shrink: 0; width: 24px; text-align: center; }
    .tree-item .tree-name { flex: 1; min-width: 0; font-size: 14px; word-break: break-all; }
    .tree-item .tree-size { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; margin-left: 8px; }
    .tree-item .tree-toggle { font-size: 12px; margin-right: 6px; color: var(--text-secondary); width: 16px; text-align: center; }
    .tree-download {
      flex-shrink: 0;
      width: 32px; height: 32px;
      margin-left: 6px;
      border: none;
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      color: var(--primary);
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .tree-download:active { background: color-mix(in srgb, var(--primary) 25%, transparent); }
    .tree-children { display: none; }
    .tree-children.expanded {
      display: block;
      margin-left: 12px;
      padding-left: 8px;
      border-left: 1.5px dashed color-mix(in srgb, var(--border) 70%, transparent);
    }
    .tree-indent { padding-left: 28px; }
    /* 层级背景色区分 */
    .tree-children .tree-children .tree-item { background: color-mix(in srgb, var(--surface) 96%, var(--text)); }
    .tree-children .tree-children .tree-children .tree-item { background: color-mix(in srgb, var(--surface) 93%, var(--text)); }
    .tree-children .tree-children .tree-children .tree-children .tree-item { background: color-mix(in srgb, var(--surface) 90%, var(--text)); }

    /* ===== Bottom Bar ===== */
    .bottom-bar {
      flex-shrink: 0;
      padding: 10px 14px;
      padding-bottom: calc(12px + env(safe-area-inset-bottom));
      padding-left: calc(14px + env(safe-area-inset-left));
      padding-right: calc(14px + env(safe-area-inset-right));
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .bottom-bar::-webkit-scrollbar { display: none; }

    .btn {
      flex: 1;
      min-width: 0;
      padding: 12px 10px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      white-space: nowrap;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-hover); }
    .btn-secondary { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { background: var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-danger:hover:not(:disabled) { background: var(--danger-hover); }

    /* ===== Modal ===== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.45);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal {
      background: var(--surface);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      width: 100%;
      max-width: 400px;
      padding: 28px 24px;
      transform: translateY(16px) scale(0.96);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .modal-overlay.active .modal { transform: translateY(0) scale(1); }
    .modal-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; text-align: center; }
    .modal-subtitle { font-size: 14px; color: var(--text-secondary); text-align: center; margin-bottom: 24px; }
    .modal-actions { display: flex; flex-direction: column; gap: 10px; }
    .modal-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 16px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .modal-btn-primary { background: var(--primary); color: #fff; }
    .modal-btn-primary:hover { background: var(--primary-hover); }
    .modal-btn-secondary { background: var(--surface-hover); color: var(--text); border: 1px solid var(--border); }
    .modal-btn-secondary:hover { background: var(--border); }
    .modal-btn-donate { background: linear-gradient(135deg, #ff9500, #ff2d55); color: #fff; }
    .modal-btn-donate:hover { filter: brightness(1.1); }
    .donate-qr {
      display: block;
      margin: 0 auto 20px;
      width: 100%;
      max-width: min(280px, 72vw);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .modal-close {
      position: absolute;
      top: 12px;
      right: 12px;
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-secondary);
      width: 36px; height: 36px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: var(--surface-hover); }

    /* ===== Password / Input Modal ===== */
    .input-group { margin-bottom: 16px; }
    .input-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.3px; }
    .input-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 15px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      outline: none;
      transition: var(--transition);
    }
    .input-group input:focus { border-color: var(--primary); }

    /* ===== Ring progress ===== */
    .ring-overlay {
      position: fixed; inset: 0;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: blur(6px);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 22px;
      z-index: 150;
      padding: 24px;
    }
    .ring-overlay.active { display: flex; }
    .ring-box { position: relative; width: 132px; height: 132px; }
    .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    .ring-track {
      fill: none;
      stroke: var(--surface-hover);
      stroke-width: 8;
    }
    .ring-value {
      fill: none;
      stroke: var(--primary);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 326.7;
      stroke-dashoffset: 326.7;
      transition: stroke-dashoffset 0.25s ease;
    }
    .ring-overlay.indeterminate .ring-svg {
      animation: ring-spin 1.1s linear infinite;
      /* 提升为独立合成层：callMain 等重活占满主线程时，旋转仍由合成器驱动不冻结 */
      will-change: transform;
    }
    .ring-overlay.indeterminate .ring-value {
      stroke-dasharray: 90 236.7;
      stroke-dashoffset: 0;
    }
    @keyframes ring-spin { to { transform: rotate(270deg); } }
    .ring-percent {
      position: absolute; inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      font-weight: 700;
      color: var(--text);
    }
    .ring-text {
      font-size: 14px;
      color: var(--text-secondary);
      text-align: center;
      max-width: 90vw;
      line-height: 1.6;
      word-break: break-word;
    }

    .toast {
      position: fixed;
      bottom: calc(90px + env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--text);
      color: var(--bg);
      padding: 12px 20px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.5;
      box-shadow: var(--shadow);
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s ease;
      z-index: 200;
      max-width: 90vw;
      width: max-content;
      max-width: min(90vw, 460px);
      white-space: normal;
      word-break: break-word;
      text-align: center;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ===== Progress Bar ===== */
    .progress-wrap {
      padding: 0 16px 16px;
    }
    .progress-bar {
      height: 5px;
      background: var(--border);
      border-radius: 100px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 100px;
      width: 0%;
      transition: width 0.2s linear;
    }
    .progress-text {
      font-size: 12px;
      color: var(--text-secondary);
      margin-top: 6px;
      text-align: center;
    }

    /* ===== Footer ===== */
    footer {
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: var(--text-secondary);
      opacity: 0.55;
      flex-shrink: 0;
    }
    footer a { color: inherit; text-decoration: none; }

    /* ===== Compress file list ===== */
    .file-list {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
    }
    .file-list-item {
      display: flex;
      align-items: center;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: var(--transition);
    }
    .file-list-item:last-child { border-bottom: none; }
    .file-list-item:hover { background: var(--surface-hover); }
    .file-list-item.selected { background: color-mix(in srgb, var(--primary) 12%, var(--surface)); }
    .file-list-item .f-icon { font-size: 20px; margin-right: 10px; flex-shrink: 0; }
    .file-list-item .f-name { flex: 1; font-size: 14px; word-break: break-all; }
    .file-list-item .f-size { font-size: 12px; color: var(--text-secondary); flex-shrink: 0; }

    /* ===== File Info Bar ===== */
    .file-info {
      flex-shrink: 0;
      padding: 8px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      font-size: 11px;
      color: var(--text-secondary);
      line-height: 1.5;
      max-height: 80px;
      overflow-y: auto;
    }
    .file-info .info-row {
      display: flex;
      margin-bottom: 2px;
    }
    .file-info .info-label {
      flex-shrink: 0;
      width: 52px;
      font-weight: 600;
    }
    .file-info .info-value {
      flex: 1;
      word-break: break-all;
      user-select: all;
    }

    /* ===== Preview Modal ===== */
    .preview-container {
      background: var(--surface);
      border-radius: var(--radius);
      width: 90%;
      max-width: 700px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: var(--shadow);
      position: relative;
      transform: scale(0.96);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    #preview-modal.active .preview-container { transform: scale(1); }
    .preview-container.fullscreen { max-width: 100%; max-height: 100vh; max-height: 100dvh; width: 100%; height: 100vh; height: 100dvh; border-radius: 0; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
    .preview-close {
      position: absolute; top: 8px; right: 8px; z-index: 5;
      background: rgba(0,0,0,0.5); color: #fff; border: none;
      width: 32px; height: 32px; border-radius: 50%;
      font-size: 18px; cursor: pointer; display: flex;
      align-items: center; justify-content: center;
    }
    .preview-body {
      flex: 1; display: flex; align-items: center; justify-content: center;
      background: #000; overflow: hidden; min-height: 200px;
      /* 配合文档类内容的绝对定位铺满：
         窗口化时容器高度不定，height:100% 无法解析导致内容溢出不可滚动，
         绝对定位相对 body 定位则不受影响 */
      position: relative;
    }
    .preview-bar {
      flex-shrink: 0; padding: 10px 14px;
      display: flex; align-items: center; justify-content: space-between;
      border-top: 1px solid var(--border);
      gap: 10px;
    }
    .preview-toggle {
      background: none; border: none; font-size: 18px; cursor: pointer;
      color: var(--text-secondary); padding: 4px; border-radius: 6px;
    }
    .preview-toggle:hover { background: var(--surface-hover); }
    /* 全屏时关闭按钮加大，便于手机点按 */
    .preview-container.fullscreen .preview-close {
      width: 48px; height: 48px;
      top: calc(12px + env(safe-area-inset-top));
      right: calc(12px + env(safe-area-inset-right));
      font-size: 22px;
    }

    .password-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .password-row input {
      flex: 1;
      padding: 8px 12px;
      border: 1.5px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      outline: none;
    }
    .password-row input:focus { border-color: var(--primary); }
    .password-row .label { font-size: 13px; font-weight: 600; white-space: nowrap; }

    /* ===== Scrollbar ===== */
    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }

    /* ===== Responsive tweaks ===== */
    @media (max-width: 400px) {
      header h1 { font-size: 16px; }
      .btn { font-size: 13px; padding: 10px 6px; }
      .modal { padding: 22px 18px; }
      .tree-item, .file-list-item { padding: 9px 11px; }
    }
  </style>
</head>
<body>

<div id="app">
  <!-- ===== MODE SELECT MODAL ===== -->
  <div class="modal-overlay active" id="mode-modal">
    <div class="modal" style="position:relative">
      <div class="modal-title">🎒 小破站解压</div>
      <div class="modal-subtitle">在浏览器里直接处理 ZIP 文件<br>无需上传，本地完成</div>
      <div class="modal-actions">
        <button class="modal-btn modal-btn-primary" onclick="app.setMode('extract')">
          📦 我要解压
        </button>
        <button class="modal-btn modal-btn-secondary" onclick="app.setMode('compress')">
          🗜️ 我要压缩
        </button>
      </div>
    </div>
  </div>

  <!-- ===== EXTRACT VIEW ===== -->
  <div id="extract-view" style="display:none; flex-direction:column; height:100%">
    <header>
      <button class="back-btn" onclick="app.goHome()" title="返回">🏠</button>
      <h1>📦 解压文件</h1>
      <button class="donate-btn" onclick="app.openDonate()" title="捐赠支持">💝 捐赠</button>
      <div class="spacer"></div>
    </header>
    <main>
      <div class="scroll-area">
        <div class="drop-zone" id="extract-drop" onclick="document.getElementById('extract-input').click()">
          <span class="icon">📂</span>
          <div class="title">点击选择压缩文件</div>
          <div class="subtitle">支持 ZIP / RAR / 7z / TAR / TGZ / APK / EXE / ISO 等，或直接拖入</div>
        </div>
        <input type="file" id="extract-input" accept=".zip,.rar,.7z,.tar,.tgz,.apk,.jar,.exe,.iso" style="display:none" onchange="app.onExtractFileSelect(this.files[0])">
        <div id="extract-tree" class="file-tree" style="display:none"></div>
      </div>
      <div class="progress-wrap" id="extract-progress" style="display:none">
        <div class="progress-bar"><div class="progress-fill" id="extract-progress-fill"></div></div>
        <div class="progress-text" id="extract-progress-text">准备中...</div>
      </div>
    </main>
    <div class="file-info" id="extract-info" style="display:none"></div>
    <div class="bottom-bar" id="extract-bar" style="display:none">
      <button class="btn btn-primary" onclick="app.extractToDir()">📂 解压</button>
